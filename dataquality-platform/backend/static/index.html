    const [selectedRuleId, setSelectedRuleId] = useState(null);
    const [searchQuery, setSearchQuery] = useState('');

    const load = useCallback(() => {
        Promise.all([
            fetchJSON('/api/tasks'),
            fetchJSON('/api/datasources'),
            fetchJSON('/api/rules'),
            fetchJSON('/api/datasources/schema-index'),
        ]).then(([t, ds, r, si]) => { setTasks(t); setDatasources(ds); setRules(r); setSchemaIndex(si); }).catch(console.error);
    }, []);

    useEffect(() => { load(); }, [load]);

    useEffect(() => {
        const hasRunning = tasks.some(t => t.status === 'running');
        if (hasRunning && !pollId) {
            const id = setInterval(load, 2000);
            setPollId(id);
        } else if (!hasRunning && pollId) {
            clearInterval(pollId);
            setPollId(null);
        }
    }, [tasks, pollId, load]);

    const getDsSchema = () => {
        if (!form.datasource_id) return null;
        const key = Object.keys(schemaIndex).find(k => k.startsWith(`${form.datasource_id}:`));
        return key ? schemaIndex[key] : null;
    };

    const getAvailableTables = () => {
        const ds = getDsSchema();
        if (!ds) return [];
        return Object.keys(ds.tables || {});
    };

    const getAvailableColumns = () => {
        const ds = getDsSchema();
        if (!ds || !form.table_name) return [];
        return ds.tables[form.table_name] || [];
    };

    const fetchRuleDefaultConfig = async (rid) => {
        if (ruleDefaultConfigs[rid]) return;
        try {
            const res = await fetchJSON(`/api/rules/${rid}/default-config`);
            setRuleDefaultConfigs(prev => ({ ...prev, [rid]: res }));
        } catch (e) {
            console.error('Failed to fetch rule config:', e);
        }
    };

    const handleCreate = async () => {
        const rule_configs = form.rule_ids.map(rid => {
            const rc = form.rule_configs.find(c => c.rule_id === rid);
            const rule = rules.find(r => r.id === rid);
            return {
                rule_id: rid,
                name: rule?.name || rc?.name || '',
                target_field: rc?.target_field || 'content',
                config: rc?.config || {},
            };
        }).filter(rc => rc.name);
        const samplingPayload = form.sampling.mode !== 'full' && form.sampling.size ? form.sampling : null;
        await fetchJSON('/api/tasks', {
            method: 'POST',
            body: JSON.stringify({ ...form, datasource_id: parseInt(form.datasource_id), rule_configs, sampling: samplingPayload }),
        });
        setModal(false);
        setForm({ name: '', datasource_id: '', table_name: '', rule_ids: [], field_mapping: {}, rule_configs: [], sampling: { mode: 'full', size: null, seed: null } });
        setRuleDefaultConfigs({});
        setExpandedRules({});
        setExpandedGroups({});
        setStep(1);
        setActiveDimension(null);
        setSelectedRuleId(null);
        setSearchQuery('');
        load();
    };

    const handleStart = async (id) => {
        await fetchJSON(`/api/tasks/${id}/start`, { method: 'POST' });
        load();
    };

    const handleCancel = async (id) => {
        await fetchJSON(`/api/tasks/${id}/cancel`, { method: 'POST' });
        load();
    };

    const handleDelete = async (id) => {
        if (!confirm('确定删除此任务？')) return;
        await fetchJSON(`/api/tasks/${id}`, { method: 'DELETE' });
        load();
    };

    const handleReport = async (id) => {
        const res = await fetchJSON(`/api/tasks/${id}/report`);
        setReportData(res);
    };

    const toggleRule = (rid) => {
        setForm(f => {
            const newIds = f.rule_ids.includes(rid)
                ? f.rule_ids.filter(id => id !== rid)
                : [...f.rule_ids, rid];
            const newConfigs = f.rule_configs.filter(c => c.rule_id !== rid);
            if (!f.rule_ids.includes(rid)) {
                const rule = rules.find(r => r.id === rid);
                const columns = getAvailableColumns();
                const defaultField = columns.length > 0 ? columns[0] : 'content';
                newConfigs.push({ rule_id: rid, name: rule?.name || '', target_field: defaultField, config: {} });
                fetchRuleDefaultConfig(rid);
            }
            return { ...f, rule_ids: newIds, rule_configs: newConfigs };
        });
    };

    const updateRuleConfig = (rid, key, value) => {
        setForm(f => ({
            ...f,
            rule_configs: f.rule_configs.map(rc =>
                rc.rule_id === rid ? { ...rc, [key]: value } : rc
            ),
        }));
    };

    const updateRuleConfigField = (rid, fieldKey, value) => {
        setForm(f => ({
            ...f,
            rule_configs: f.rule_configs.map(rc =>
                rc.rule_id === rid ? { ...rc, config: { ...rc.config, [fieldKey]: value } } : rc
            ),
        }));
    };

    const toggleExpand = (rid) => {
        setExpandedRules(prev => ({ ...prev, [rid]: !prev[rid] }));
    };

    const toggleGroup = (group) => {
        setExpandedGroups(prev => ({ ...prev, [group]: !prev[group] }));
    };

    const addListItem = (rid, fieldKey) => {
        setForm(f => ({
            ...f,
            rule_configs: f.rule_configs.map(rc => {
                if (rc.rule_id !== rid) return rc;
                const list = rc.config[fieldKey] || [];
                return { ...rc, config: { ...rc.config, [fieldKey]: [...list, ''] } };
            }),
        }));
    };

    const removeListItem = (rid, fieldKey, idx) => {
        setForm(f => ({
            ...f,
            rule_configs: f.rule_configs.map(rc => {
                if (rc.rule_id !== rid) return rc;
                const list = (rc.config[fieldKey] || []).filter((_, i) => i !== idx);
                return { ...rc, config: { ...rc.config, [fieldKey]: list } };
            }),
        }));
    };

    const updateListItem = (rid, fieldKey, idx, value) => {
        setForm(f => ({
            ...f,
            rule_configs: f.rule_configs.map(rc => {
                if (rc.rule_id !== rid) return rc;
                const list = (rc.config[fieldKey] || []).map((item, i) => i === idx ? value : item);
                return { ...rc, config: { ...rc.config, [fieldKey]: list } };
            }),
        }));
    };

    // 导出配置功能
    const exportConfig = () => {
        if (form.rule_ids.length === 0) {
            alert('请先选择要导出的规则');
            return;
        }

        const configData = {
            version: '1.0',
            exported_at: new Date().toISOString(),
            rule_ids: form.rule_ids,
            rule_configs: form.rule_configs
        };

        const blob = new Blob([JSON.stringify(configData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        a.href = url;
        a.download = `rule-config-${timestamp}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    };

    // 导入配置功能
    const importConfig = (file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const configData = JSON.parse(e.target.result);
                
                // 验证格式
                if (!configData.rule_ids || !Array.isArray(configData.rule_ids)) {
                    throw new Error('无效的配置文件格式');
                }

                // 验证规则是否存在
                const validRuleIds = configData.rule_ids.filter(rid => {
                    return rules.some(r => r.id === rid);
                });

                if (validRuleIds.length === 0) {
                    alert('配置文件中的规则在当前系统中不存在');
                    return;
                }

                // 过滤有效的配置
                const validConfigs = (configData.rule_configs || []).filter(rc => 
                    validRuleIds.includes(rc.rule_id)
                );

                // 设置表单
                setForm(f => ({
                    ...f,
                    rule_ids: validRuleIds,
                    rule_configs: validConfigs.length > 0 ? validConfigs : validRuleIds.map(rid => {
                        const rule = rules.find(r => r.id === rid);
                        const columns = getAvailableColumns();
                        const defaultField = columns.length > 0 ? columns[0] : 'content';
                        return {
                            rule_id: rid,
                            name: rule?.name || '',
                            target_field: defaultField,
                            config: {}
                        };
                    })
                }));

                // 获取每个规则的默认配置
                validRuleIds.forEach(rid => fetchRuleDefaultConfig(rid));

                alert(`成功导入 ${validRuleIds.length} 条规则配置`);
            } catch (err) {
                alert('导入配置失败: ' + err.message);
            }
        };
        reader.readAsText(file);
    };

    // 从现有任务复制配置
    const copyFromTask = (task) => {
        let ruleIds = [];
        let ruleConfigs = [];

        try {
            // 解析 rule_ids (可能是字符串或数组)
            if (typeof task.rule_ids === 'string') {
                ruleIds = JSON.parse(task.rule_ids);
            } else if (Array.isArray(task.rule_ids)) {
                ruleIds = task.rule_ids;
            }

            // 使用任务的 rule_configs
            ruleConfigs = task.rule_configs || [];
        } catch (err) {
            console.error('解析任务配置失败:', err);
        }

        if (ruleIds.length === 0) {
            alert('该任务没有可复制的规则配置');
            return;
        }

        // 验证规则是否存在
        const validRuleIds = ruleIds.filter(rid => rules.some(r => r.id === rid));
        
        if (validRuleIds.length === 0) {
            alert('该任务的规则在当前系统中不存在');
            return;
        }

        // 过滤有效的配置
        const validConfigs = ruleConfigs.filter(rc => validRuleIds.includes(rc.rule_id));

        // 打开创建任务模态框并填充配置
        setModal(true);
        setStep(1);
        setForm(f => ({
            ...f,
            name: task.name + ' (副本)',
            rule_ids: validRuleIds,
            rule_configs: validConfigs.length > 0 ? validConfigs : validRuleIds.map(rid => {
                const rule = rules.find(r => r.id === rid);
                const columns = getAvailableColumns();
                const defaultField = columns.length > 0 ? columns[0] : 'content';
                return {
                    rule_id: rid,
                    name: rule?.name || '',
                    target_field: defaultField,
                    config: {}
                };
            })
        }));

        // 获取每个规则的默认配置
        validRuleIds.forEach(rid => fetchRuleDefaultConfig(rid));
    };

    const renderConfigField = (rid, field) => {
        const rc = form.rule_configs.find(c => c.rule_id === rid);
        if (!rc) return null;
        const currentValue = rc.config[field.key];

        if (field.type === 'number') {
            return (
                <div key={field.key} className="mb-2">
                    <label className="block text-xs text-gray-400 mb-1">{field.label}</label>
                    <input type="number" step="any" className="input-field w-full rounded-lg px-3 py-1.5 text-white text-sm"
                        value={currentValue !== undefined ? currentValue : field.default}
                        onChange={e => updateRuleConfigField(rid, field.key, parseFloat(e.target.value))}
                        placeholder={String(field.default)} />
                </div>
            );
        }

        if (field.type === 'text') {
            return (
                <div key={field.key} className="mb-2">
                    <label className="block text-xs text-gray-400 mb-1">{field.label}</label>
                    <input className="input-field w-full rounded-lg px-3 py-1.5 text-white text-sm font-mono"
                        value={currentValue !== undefined ? currentValue : field.default}
                        onChange={e => updateRuleConfigField(rid, field.key, e.target.value)}
                        placeholder={String(field.default)} />
                </div>
            );
        }

        if (field.type === 'list') {
            const items = currentValue || field.default || [];
            return (
                <div key={field.key} className="mb-2">
                    <label className="block text-xs text-gray-400 mb-1">{field.label}</label>
                    <div className="space-y-1">
                        {items.map((item, idx) => (
                            <div key={idx} className="flex items-center gap-1">
                                <input className="input-field flex-1 rounded-lg px-2 py-1 text-white text-xs font-mono"
                                    value={item} onChange={e => updateListItem(rid, field.key, idx, e.target.value)} />
                                <button onClick={() => removeListItem(rid, field.key, idx)}
                                    className="text-coral hover:text-red-400 text-sm leading-none">&times;</button>
                            </div>
                        ))}
                        <button onClick={() => addListItem(rid, field.key)}
                            className="btn-ghost text-brand-300 px-2 py-1 rounded text-xs w-full">+ 添加</button>
                    </div>
                </div>
            );
        }

        return null;
    };

    const groupedRules = {};
    rules.forEach(r => {
        const mt = r.metric_type || 'other';
        if (!groupedRules[mt]) groupedRules[mt] = [];
        groupedRules[mt].push(r);
    });

    return (
        <div className="fade-in">
            <div className="flex items-center justify-between mb-6">
                <h1 className="font-display text-2xl font-bold text-white">检测任务</h1>
                <button onClick={() => setModal(true)} className="btn-primary text-white px-4 py-2 rounded-lg text-sm font-medium">+ 创建任务</button>
            </div>

            <div className="grid gap-3">
                {tasks.map((t, i) => {
                    const st = STATUS_MAP[t.status] || STATUS_MAP.pending;
                    return (
                        <div key={t.id} className="glass-card rounded-xl p-5 slide-in" style={{ animationDelay: `${i * 50}ms` }}>
                            <div className="flex items-center justify-between mb-3">
                                <div className="flex items-center gap-3">
                                    <div className="font-display text-white font-semibold text-lg">{t.name}</div>
                                    <span className={`badge ${st.color}`}>{st.label}</span>
                                    {t.table_name && <span className="badge bg-surface-300 text-gray-400 text-[0.65rem]">{t.table_name}</span>}
                                    {t.sampling && t.sampling.mode !== 'full' && (
                                        <span className="badge bg-amber/15 text-amber text-[0.65rem]">
                                            {t.sampling.mode === 'random' ? `随机抽样 ${t.sampling.size}条` : `前${t.sampling.size}条`}
                                        </span>
                                    )}
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => copyFromTask(t)} className="btn-ghost text-amber px-3 py-1.5 rounded-lg text-xs" title="复制此任务的规则配置">
                                        📋 复制配置
                                    </button>
                                    {t.status === 'pending' && (
                                        <button onClick={() => handleStart(t.id)} className="btn-primary text-white px-3 py-1.5 rounded-lg text-xs">启动</button>
                                    )}
                                    {t.status === 'running' && (
                                        <button onClick={() => handleCancel(t.id)} className="btn-danger text-white px-3 py-1.5 rounded-lg text-xs">取消</button>
                                    )}
                                    {t.status === 'completed' && (
                                        <>
                                            <button onClick={() => handleReport(t.id)} className="btn-ghost text-mint px-3 py-1.5 rounded-lg text-xs">查看报告</button>
                                            <a href={API + `/api/tasks/${t.id}/download-csv`} className="btn-ghost text-sky px-3 py-1.5 rounded-lg text-xs inline-block">下载问题数据</a>
                                        </>
                                    )}
                                    <button onClick={() => handleDelete(t.id)} className="btn-ghost text-coral px-3 py-1.5 rounded-lg text-xs">删除</button>
                                </div>
                            </div>

                            {t.rule_configs && t.rule_configs.length > 0 && (
                                <div className="flex flex-wrap gap-1 mb-2">
                                    {t.rule_configs.map((rc, ri) => (
                                        <span key={ri} className="badge bg-surface-300 text-gray-400 text-[0.65rem]">
                                            {rc.name} → {rc.target_field || 'content'}
                                            {rc.config && Object.keys(rc.config).length > 0 && ' ⚙️'}
                                        </span>
                                    ))}
                                </div>
                            )}

                            {t.status === 'running' && (
                                <div className="mb-3">
                                    <div className="flex justify-between text-xs text-gray-400 mb-1">
                                        <span>进度</span>
                                        <span>{t.processed}/{t.total} ({t.progress.toFixed(1)}%)</span>
                                    </div>
                                    <div className="h-2 bg-surface-300 rounded-full overflow-hidden">
                                        <div className="h-full bg-gradient-to-r from-brand-600 to-brand-400 rounded-full progress-bar-striped"
                                            style={{ width: `${t.progress}%`, transition: 'width 0.5s ease' }} />
                                    </div>
                                </div>
                            )}

                            {t.status === 'completed' && t.score != null && (
                                <div className="flex items-center gap-6">
                                    <ScoreRing score={t.score} size={80} />
                                    <div className="grid grid-cols-3 gap-4">
                                        <div><div className="text-xs text-gray-500">总数据</div><div className="font-display text-white font-bold">{t.total}</div></div>
                                        <div><div className="text-xs text-gray-500">合格</div><div className="font-display text-mint font-bold">{t.num_good}</div></div>
                                        <div><div className="text-xs text-gray-500">问题</div><div className="font-display text-coral font-bold">{t.num_bad}</div></div>
                                    </div>
                                </div>
                            )}

                            {t.error_message && (
                                <div className="text-xs text-coral bg-coral/10 rounded-lg px-3 py-2 mt-2">{t.error_message}</div>
                            )}
                        </div>
                    );
                })}
                {tasks.length === 0 && <div className="text-center text-gray-500 py-12">暂无任务，点击右上角创建</div>}
            </div>

            <Modal open={modal} onClose={() => { setModal(false); setStep(1); setActiveDimension(null); setSelectedRuleId(null); setSearchQuery(''); setRuleDefaultConfigs({}); setExpandedRules({}); setExpandedGroups({}); }} title="创建检测任务" wide={step >= 2}>
                {step === 1 && (
                    <div className="space-y-4">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="flex items-center gap-2">
                                <div className="w-7 h-7 rounded-full bg-brand-600 text-white flex items-center justify-center text-xs font-bold">1</div>
                                <span className="text-sm font-medium text-white">数据配置</span>
                            </div>
                            <div className="flex-1 h-px bg-surface-300"></div>
                            <div className="flex items-center gap-2">
                                <div className="w-7 h-7 rounded-full bg-surface-300 text-gray-500 flex items-center justify-center text-xs font-bold">2</div>
                                <span className="text-sm text-gray-500">规则配置</span>
                            </div>
                            <div className="flex-1 h-px bg-surface-300"></div>
                            <div className="flex items-center gap-2">
                                <div className="w-7 h-7 rounded-full bg-surface-300 text-gray-500 flex items-center justify-center text-xs font-bold">3</div>
                                <span className="text-sm text-gray-500">规则确认</span>
                            </div>
                        </div>
                        <div>
                            <label className="block text-sm text-gray-400 mb-1">任务名称</label>
                            <input className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.name}
                                onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="输入任务名称" />
                        </div>
                        <div>
                            <label className="block text-sm text-gray-400 mb-1">数据源</label>
                            <select className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.datasource_id}
                                onChange={e => setForm(f => ({ ...f, datasource_id: e.target.value, table_name: '' }))}>
                                <option value="">选择数据源</option>
                                {datasources.map(ds => {
                                    const dsSchema = Object.keys(schemaIndex).find(k => k.startsWith(`${ds.id}:`));
                                    const dbName = dsSchema ? schemaIndex[dsSchema]?.db_name : ds.config?.database;
                                    return <option key={ds.id} value={ds.id}>{ds.name} ({DS_TYPE_MAP[ds.type]?.label}{dbName ? ` · ${dbName}` : ''})</option>;
                                })}
                            </select>
                        </div>
                        {form.datasource_id && getAvailableTables().length > 0 && (
                            <div>
                                <label className="block text-sm text-gray-400 mb-1">选择表</label>
                                <select className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.table_name}
                                    onChange={e => setForm(f => ({ ...f, table_name: e.target.value }))}>
                                    <option value="">选择表</option>
                                    {getAvailableTables().map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                            </div>
                        )}
                        <div>
                            <label className="block text-sm text-gray-400 mb-1">数据范围</label>
                            <div className="space-y-2 p-3 bg-surface-0 rounded-lg">
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="sampling_mode" checked={form.sampling.mode === 'full'}
                                        onChange={() => setForm(f => ({ ...f, sampling: { ...f.sampling, mode: 'full' } }))}
                                        className="text-brand-500 bg-surface-0 border-brand-600 focus:ring-brand-500" />
                                    <span className="text-sm text-white">全量检测</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="sampling_mode" checked={form.sampling.mode === 'random'}
                                        onChange={() => setForm(f => ({ ...f, sampling: { ...f.sampling, mode: 'random' } }))}
                                        className="text-brand-500 bg-surface-0 border-brand-600 focus:ring-brand-500" />
                                    <span className="text-sm text-white">随机抽样</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="sampling_mode" checked={form.sampling.mode === 'first_n'}
                                        onChange={() => setForm(f => ({ ...f, sampling: { ...f.sampling, mode: 'first_n' } }))}
                                        className="text-brand-500 bg-surface-0 border-brand-600 focus:ring-brand-500" />
                                    <span className="text-sm text-white">取前N条</span>
                                </label>
                                {form.sampling.mode !== 'full' && (
                                    <div className="ml-6 space-y-2 fade-in">
                                        <div className="flex items-center gap-2">
                                            <label className="text-xs text-gray-400 w-12">数量</label>
                                            <input type="number" min="1" className="input-field w-32 rounded-lg px-3 py-1.5 text-white text-sm"
                                                value={form.sampling.size || ''}
                                                onChange={e => setForm(f => ({ ...f, sampling: { ...f.sampling, size: parseInt(e.target.value) || null } }))}
                                                placeholder="抽取条数" />
                                            <span className="text-xs text-gray-500">条</span>
                                        </div>
                                        {form.sampling.mode === 'random' && (
                                            <div className="flex items-center gap-2">
                                                <label className="text-xs text-gray-400 w-12">种子</label>
                                                <input type="number" className="input-field w-32 rounded-lg px-3 py-1.5 text-white text-sm"
                                                    value={form.sampling.seed || ''}
                                                    onChange={e => setForm(f => ({ ...f, sampling: { ...f.sampling, seed: parseInt(e.target.value) || null } }))}
                                                    placeholder="可选，留空随机" />
                                                <span className="text-xs text-gray-500">可复现</span>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                            {form.sampling.mode !== 'full' && form.sampling.size && (
                                <div className="text-xs text-gray-500 mt-1">
                                    {form.sampling.mode === 'random' ? `将从数据集中随机抽取 ${form.sampling.size} 条进行检测` : `将取数据集前 ${form.sampling.size} 条进行检测`}
                                </div>
                            )}
                        </div>
                        <div className="flex justify-end gap-3 pt-2">
                            <button onClick={() => { setModal(false); setStep(1); setActiveDimension(null); setSelectedRuleId(null); setSearchQuery(''); setRuleDefaultConfigs({}); setExpandedRules({}); setExpandedGroups({}); }} className="btn-ghost text-gray-400 px-4 py-2 rounded-lg text-sm">取消</button>
                            <button onClick={() => {
                                setStep(2);
                            }} className="btn-primary text-white px-4 py-2 rounded-lg text-sm"
                                disabled={!form.name || !form.datasource_id}>下一步 →</button>
                        </div>
                    </div>
                )}
                {step === 2 && (() => {
                    const searchFilteredRules = searchQuery
                        ? rules.filter(r => r.name.toLowerCase().includes(searchQuery.toLowerCase()) || (r.description && r.description.toLowerCase().includes(searchQuery.toLowerCase())))
                        : null;
                    const selectedRule = selectedRuleId ? rules.find(r => r.id === selectedRuleId) : null;
                    const selectedRc = selectedRuleId ? form.rule_configs.find(c => c.rule_id === selectedRuleId) : null;
                    const selectedDefaultCfg = selectedRuleId ? ruleDefaultConfigs[selectedRuleId] : null;
                    const columns = getAvailableColumns();

                    return (
                        <div className="space-y-0">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="flex items-center gap-2 cursor-pointer" onClick={() => setStep(1)}>
                                    <div className="w-7 h-7 rounded-full bg-mint/20 text-mint flex items-center justify-center text-xs font-bold">✓</div>
                                    <span className="text-sm text-mint">数据配置</span>
                                </div>
                                <div className="flex-1 h-px bg-brand-600"></div>
                                <div className="flex items-center gap-2">
                                    <div className="w-7 h-7 rounded-full bg-brand-600 text-white flex items-center justify-center text-xs font-bold">2</div>
                                    <span className="text-sm font-medium text-white">规则配置</span>
                                </div>
                                <div className="flex-1 h-px bg-surface-300"></div>
                                <div className="flex items-center gap-2">
                                    <div className="w-7 h-7 rounded-full bg-surface-300 text-gray-500 flex items-center justify-center text-xs font-bold">3</div>
                                    <span className="text-sm text-gray-500">规则确认</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-3 mb-3">
                                <div className="relative flex-1">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm">🔍</span>
                                    <input className="input-field w-full rounded-lg pl-9 pr-3 py-2 text-white text-sm" value={searchQuery}
                                        onChange={e => setSearchQuery(e.target.value)} placeholder="搜索规则名称或描述..." />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white text-sm">&times;</button>
                                    )}
                                </div>
                                <div className="text-xs text-gray-400 whitespace-nowrap">
                                    已选 <span className="text-brand-300 font-bold">{form.rule_ids.length}</span> 条规则
                                </div>
                                <div className="flex gap-2">
                                    <input type="file" accept=".json" id="importConfig" className="hidden"
                                        onChange={e => {
                                            if (e.target.files && e.target.files[0]) {
                                                importConfig(e.target.files[0]);
                                                e.target.value = '';
                                            }
                                        }} />
                                    <button onClick={() => document.getElementById('importConfig').click()}
                                        className="btn-ghost text-amber px-3 py-1.5 rounded-lg text-xs whitespace-nowrap">
                                        📥 导入配置
                                    </button>
                                    <button onClick={exportConfig}
                                        className="btn-ghost text-mint px-3 py-1.5 rounded-lg text-xs whitespace-nowrap">
                                        📤 导出配置
                                    </button>
                                </div>
                            </div>

                            <div className="flex gap-3" style={{ minHeight: 360 }}>
                                <div className="w-64 flex-shrink-0 bg-surface-0 rounded-lg overflow-y-auto" style={{ maxHeight: 360 }}>
                                    {searchQuery ? (
                                        <div>
                                            <div className="px-3 py-2 text-xs font-medium text-amber border-b border-surface-300">
                                                搜索结果 ({searchFilteredRules.length})
                                            </div>
                                            {searchFilteredRules.length === 0 && (
                                                <div className="text-xs text-gray-600 text-center py-6">无匹配规则</div>
                                            )}
                                            {searchFilteredRules.map(r => {
                                                const checked = form.rule_ids.includes(r.id);
                                                const isSelected = selectedRuleId === r.id;
                                                return (
                                                    <div key={r.id}
                                                        className={`flex items-start gap-2 px-3 py-2 cursor-pointer transition-colors border-l-2 ${isSelected ? 'bg-brand-800/20 border-brand-500' : checked ? 'bg-surface-200/50 border-transparent' : 'border-transparent hover:bg-surface-200/30'}`}
                                                        onClick={() => { setSelectedRuleId(r.id); fetchRuleDefaultConfig(r.id); }}>
                                                        <input type="checkbox" checked={checked}
                                                            onChange={e => { e.stopPropagation(); toggleRule(r.id); }}
                                                            className="rounded border-brand-600 bg-surface-0 text-brand-500 focus:ring-brand-500 mt-0.5" />
                                                        <div className="flex-1 min-w-0">
                                                            <div className={`text-xs font-medium truncate ${checked ? 'text-white' : 'text-gray-300'}`}>{r.name}</div>
                                                            {r.description && <div className="text-[10px] text-gray-500 truncate mt-0.5">{r.description}</div>}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        Object.entries(groupedRules).map(([mt, grs]) => {
                                            const dc = getDimColor(mt);
                                            const label = DIMENSION_LABELS[mt] || mt.replace('QUALITY_BAD_', '');
                                            const isExpanded = expandedGroups[mt] !== false;
                                            const selectedCount = grs.filter(r => form.rule_ids.includes(r.id)).length;
                                            return (
                                                <div key={mt}>
                                                    <div className="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-surface-200/30 transition-colors border-l-2 border-transparent"
                                                        onClick={() => toggleGroup(mt)}>
                                                        <span className="text-[10px]" style={{ color: dc.text }}>{isExpanded ? '▼' : '▶'}</span>
                                                        <span className="text-xs font-medium flex-1" style={{ color: dc.text }}>{label}</span>
                                                        <span className="text-[10px] text-gray-500">{grs.length}</span>
                                                        {selectedCount > 0 && (
                                                            <span className="px-1 rounded text-[10px]" style={{ background: dc.bg, color: dc.text }}>{selectedCount}</span>
                                                        )}
                                                    </div>
                                                    {isExpanded && grs.map(r => {
                                                        const checked = form.rule_ids.includes(r.id);
                                                        const isSelected = selectedRuleId === r.id;
                                                        return (
                                                            <div key={r.id}
                                                                className={`flex items-start gap-2 px-3 py-1.5 cursor-pointer transition-colors border-l-2 ${isSelected ? 'bg-brand-800/20 border-brand-500' : checked ? 'bg-surface-200/50 border-transparent' : 'border-transparent hover:bg-surface-200/30'}`}
                                                                onClick={() => { setSelectedRuleId(r.id); fetchRuleDefaultConfig(r.id); }}>
                                                                <input type="checkbox" checked={checked}
                                                                    onChange={e => { e.stopPropagation(); toggleRule(r.id); }}
                                                                    className="rounded border-brand-600 bg-surface-0 text-brand-500 focus:ring-brand-500 mt-0.5" />
                                                                <div className="flex-1 min-w-0">
                                                                    <div className={`text-xs font-medium truncate ${checked ? 'text-white' : 'text-gray-300'}`}>{r.name}</div>
                                                                    {r.description && <div className="text-[10px] text-gray-500 truncate mt-0.5">{r.description}</div>}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>

                                <div className="flex-1 bg-surface-0 rounded-lg p-4 overflow-y-auto" style={{ maxHeight: 360 }}>
                                    {selectedRule ? (
                                        <div className="fade-in">
                                            <div className="flex items-center gap-2 mb-3">
                                                <h4 className="text-sm font-semibold text-white">{selectedRule.name}</h4>
                                                {selectedRule.is_builtin && <span className="badge bg-brand-800/50 text-brand-300 text-[0.6rem]">内置</span>}
                                            </div>
                                            {selectedRule.description && (
                                                <div className="text-xs text-gray-400 mb-3 leading-relaxed">{selectedRule.description}</div>
                                            )}
                                            <div className="mb-3">
                                                <span className="text-[10px] text-gray-500">质量维度</span>
                                                <span className="ml-2 text-xs" style={{ color: getDimColor(selectedRule.metric_type).text }}>
                                                    {DIMENSION_LABELS[selectedRule.metric_type] || selectedRule.metric_type?.replace('QUALITY_BAD_', '')}
                                                </span>
                                            </div>

                                            <div className="border-t border-surface-300 pt-3 mb-3">
                                                <label className="block text-[10px] text-gray-400 mb-1.5">目标字段</label>
                                                {columns.length > 0 ? (
                                                    <div className="flex flex-wrap gap-1">
                                                        {columns.map(col => {
                                                            const isFieldSelected = (selectedRc?.target_field || '').split(',').map(s => s.trim()).includes(col);
                                                            return (
                                                                <label key={col} className={`inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] cursor-pointer transition-colors ${isFieldSelected ? 'bg-brand-700/40 text-brand-300' : 'bg-surface-300 text-gray-400 hover:bg-surface-200'}`}>
                                                                    <input type="checkbox" checked={isFieldSelected}
                                                                        onChange={e => {
                                                                            const current = (selectedRc?.target_field || '').split(',').map(s => s.trim()).filter(Boolean);
                                                                            const next = e.target.checked ? [...current, col] : current.filter(c => c !== col);
                                                                            updateRuleConfig(selectedRuleId, 'target_field', next.join(','));
                                                                        }}
                                                                        className="sr-only" />
                                                                    {col}
                                                                </label>
                                                            );
                                                        })}
                                                    </div>
                                                ) : (
                                                    <input className="input-field w-full rounded-lg px-2 py-1 text-white text-xs"
                                                        value={selectedRc?.target_field || 'content'}
                                                        onChange={e => updateRuleConfig(selectedRuleId, 'target_field', e.target.value)}
                                                        placeholder="content" />
                                                )}
                                            </div>

                                            {selectedDefaultCfg ? (
                                                selectedDefaultCfg.configurable_fields?.length > 0 ? (
                                                    <div className="border-t border-surface-300 pt-3">
                                                        <div className="text-[10px] text-gray-400 mb-2">参数配置</div>
                                                        {selectedDefaultCfg.configurable_fields.map(field => renderConfigField(selectedRuleId, field))}
                                                    </div>
                                                ) : (
                                                    <div className="border-t border-surface-300 pt-3">
                                                        <div className="text-[10px] text-gray-600">此规则无可配置参数</div>
                                                    </div>
                                                )
                                            ) : (
                                                <div className="border-t border-surface-300 pt-3">
                                                    <div className="text-[10px] text-gray-600">加载配置中...</div>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center h-full text-gray-600">
                                            <div className="text-2xl mb-2">📋</div>
                                            <div className="text-xs">点击左侧规则查看详情和配置</div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="flex justify-between pt-3 mt-3 border-t border-surface-300">
                                <button onClick={() => setStep(1)} className="btn-ghost text-gray-400 px-4 py-2 rounded-lg text-sm">← 上一步</button>
                                <div className="flex gap-3">
                                    <button onClick={() => { setModal(false); setStep(1); setActiveDimension(null); setSelectedRuleId(null); setSearchQuery(''); setRuleDefaultConfigs({}); setExpandedRules({}); setExpandedGroups({}); }} className="btn-ghost text-gray-400 px-4 py-2 rounded-lg text-sm">取消</button>
                                    <button onClick={() => setStep(3)} className="btn-primary text-white px-4 py-2 rounded-lg text-sm"
                                        disabled={form.rule_ids.length === 0}>下一步 →</button>
                                </div>
                            </div>
                        </div>
                    );
                })()}
                {step === 3 && (
                    <div className="space-y-4">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setStep(1)}>
                                <div className="w-7 h-7 rounded-full bg-mint/20 text-mint flex items-center justify-center text-xs font-bold">✓</div>
                                <span className="text-sm text-mint">数据配置</span>
                            </div>
                            <div className="flex-1 h-px bg-mint/40"></div>
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setStep(2)}>
                                <div className="w-7 h-7 rounded-full bg-mint/20 text-mint flex items-center justify-center text-xs font-bold">✓</div>
                                <span className="text-sm text-mint">规则配置</span>
                            </div>
                            <div className="flex-1 h-px bg-brand-600"></div>
                            <div className="flex items-center gap-2">
                                <div className="w-7 h-7 rounded-full bg-brand-600 text-white flex items-center justify-center text-xs font-bold">3</div>
                                <span className="text-sm font-medium text-white">规则确认</span>
                            </div>
                        </div>

                        <div className="text-xs text-gray-400 mb-2">
                            已选择 <span className="text-brand-300 font-bold">{form.rule_ids.length}</span> 条规则
                        </div>

                        {form.rule_ids.length === 0 ? (
                            <div className="text-center py-12 text-gray-600">
                                <div className="text-2xl mb-2">📭</div>
                                <div className="text-xs">暂无已选规则，请返回上一步选择</div>
                            </div>
                        ) : (
                            <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                                {form.rule_ids.map(rid => {
                                    const rule = rules.find(r => r.id === rid);
                                    const rc = form.rule_configs.find(c => c.rule_id === rid);
                                    const dc = getDimColor(rule?.metric_type);
                                    const dimLabel = rule ? (DIMENSION_LABELS[rule.metric_type] || rule.metric_type?.replace('QUALITY_BAD_', '')) : '';
                                    const defaultCfg = ruleDefaultConfigs[rid];
                                    const configFields = defaultCfg?.configurable_fields || [];
                                    const configValues = rc?.config || {};

                                    return (
                                        <div key={rid} className="bg-surface-0 rounded-lg p-3 border border-surface-300 hover:border-brand-800/30 transition-colors">
                                            <div className="flex items-center gap-2 mb-2">
                                                <span className="text-sm font-semibold text-white flex-1">{rule?.name || rid}</span>
                                                {dimLabel && (
                                                    <span className="text-[10px] px-2 py-0.5 rounded" style={{ background: dc.bg, color: dc.text }}>{dimLabel}</span>
                                                )}
                                                <button onClick={() => toggleRule(rid)}
                                                    className="text-gray-500 hover:text-coral transition-colors text-sm px-1 leading-none"
                                                    title="移除此规则">&times;</button>
                                            </div>
                                            <div className="space-y-1 text-xs">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-gray-500 w-16 flex-shrink-0">目标字段</span>
                                                    <span className="text-gray-300">{rc?.target_field || 'content'}</span>
                                                </div>
                                                {configFields.length > 0 ? (
                                                    configFields.map(field => (
                                                        <div key={field.key} className="flex items-center gap-2">
                                                            <span className="text-gray-500 w-16 flex-shrink-0">{field.label || field.key}</span>
                                                            <span className="text-gray-300">{configValues[field.key] !== undefined ? String(configValues[field.key]) : String(field.default ?? '')}</span>
                                                        </div>
                                                    ))
                                                ) : (
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-gray-500 w-16 flex-shrink-0">参数</span>
                                                        <span className="text-gray-600">无</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        <div className="flex justify-between pt-3 mt-3 border-t border-surface-300">
                            <button onClick={() => setStep(2)} className="btn-ghost text-gray-400 px-4 py-2 rounded-lg text-sm">← 上一步</button>
                            <div className="flex gap-3">
                                <button onClick={() => { setModal(false); setStep(1); setActiveDimension(null); setSelectedRuleId(null); setSearchQuery(''); setRuleDefaultConfigs({}); setExpandedRules({}); setExpandedGroups({}); }} className="btn-ghost text-gray-400 px-4 py-2 rounded-lg text-sm">取消</button>
                                <button onClick={handleCreate} className="btn-primary text-white px-4 py-2 rounded-lg text-sm"
                                    disabled={form.rule_ids.length === 0}>确认创建</button>
                            </div>
                        </div>
                    </div>
                )}
            </Modal>

            <Modal open={!!reportData} onClose={() => setReportData(null)} title="检测报告">
                {reportData && (
                    <div className="space-y-5">
                        <div className="flex items-center gap-6">
                            <ScoreRing score={reportData.score || 0} size={100} />
                            <div className="grid grid-cols-3 gap-4">
                                <div><div className="text-xs text-gray-500">总数据</div><div className="font-display text-white font-bold text-xl">{reportData.total}</div></div>
                                <div><div className="text-xs text-gray-500">合格</div><div className="font-display text-mint font-bold text-xl">{reportData.num_good}</div></div>
                                <div><div className="text-xs text-gray-500">问题</div><div className="font-display text-coral font-bold text-xl">{reportData.num_bad}</div></div>
                            </div>
                        </div>

                        {reportData.type_ratio && Object.keys(reportData.type_ratio).length > 0 && (
                            <div>
                                <h4 className="text-sm font-medium text-gray-300 mb-2">问题类型分布</h4>
                                <div className="space-y-2">
                                    {Object.entries(reportData.type_ratio).map(([field, types]) => (
                                        <div key={field} className="bg-surface-0 rounded-lg p-3">
                                            <div className="text-xs text-gray-400 mb-2">字段: {field}</div>
                                            {Object.entries(types).map(([type, ratio]) => {
                                                const pct = (ratio * 100).toFixed(2);
                                                return (
                                                    <div key={type} className="flex items-center gap-2 mb-1">
                                                        <div className="flex-1 h-4 bg-surface-300 rounded-full overflow-hidden">
                                                            <div className="h-full bg-gradient-to-r from-coral to-amber rounded-full" style={{ width: `${Math.min(pct * 5, 100)}%` }} />
                                                        </div>
                                                        <span className="text-xs text-gray-400 w-48 truncate">{type}</span>
                                                        <span className="text-xs text-coral font-mono w-16 text-right">{pct}%</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {reportData.bad_data && reportData.bad_data.length > 0 && (
                            <div>
                                <h4 className="text-sm font-medium text-gray-300 mb-2">问题数据 (前 {reportData.bad_data.length} 条)</h4>
                                <div className="max-h-60 overflow-y-auto space-y-2">
                                    {reportData.bad_data.map((item, i) => (
                                        <div key={i} className="bg-surface-0 rounded-lg p-3 text-xs">
                                            <div className="text-coral mb-1">
                                                {item.dingo_result?.eval_details && Object.entries(item.dingo_result.eval_details).map(([field, details]) =>
                                                    details.map((d, j) => <span key={j} className="badge bg-coral/15 text-coral mr-1">{d.metric}: {d.label?.join(', ')}</span>)
                                                )}
                                            </div>
                                            <div className="text-gray-400 truncate">
                                                {item.content || item.prompt || JSON.stringify(item).substring(0, 120)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                )}
            </Modal>
        </div>
    );
}

function App() {
    const [page, setPage] = useState('dashboard');

    const navItems = [
        { id: 'dashboard', label: '控制台', icon: '◉' },
        { id: 'datasources', label: '数据源', icon: '🗄️' },
        { id: 'rules', label: '规则管理', icon: '⚖️' },
        { id: 'tasks', label: '检测任务', icon: '🔍' },
    ];

    return (
        <div className="flex h-screen overflow-hidden">
            <aside className="w-56 flex-shrink-0 bg-surface-50 border-r border-brand-800/20 flex flex-col">
                <div className="p-5 border-b border-brand-800/20">
                    <div className="flex items-center gap-2">
                        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-display font-bold text-sm">DQ</div>
                        <div>
                            <div className="text-white font-display font-semibold text-sm leading-tight">数据质量</div>
                            <div className="text-[10px] text-gray-500 leading-tight">检测平台 v1.0</div>
                        </div>
                    </div>
                </div>
                <nav className="flex-1 py-3">
                    {navItems.map(item => (
                        <button key={item.id} onClick={() => setPage(item.id)}
                            className={`sidebar-item w-full flex items-center gap-3 px-5 py-3 text-sm ${page === item.id ? 'active text-brand-300' : 'text-gray-400 hover:text-gray-200'}`}>
                            <span className="text-base">{item.icon}</span>
                            <span>{item.label}</span>
                        </button>
                    ))}
                </nav>
                <div className="p-4 border-t border-brand-800/20">
                    <div className="text-[10px] text-gray-600 text-center">Powered by dingo engine</div>
                </div>
            </aside>

            <main className="flex-1 overflow-y-auto p-6 lg:p-8">
                {page === 'dashboard' && <DashboardPage />}
                {page === 'datasources' && <DatasourcesPage />}
                {page === 'rules' && <RulesPage />}
                {page === 'tasks' && <TasksPage />}
            </main>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
