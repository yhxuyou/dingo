<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据质量检测平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    display: ['Space Grotesk', 'Noto Sans SC', 'sans-serif'],
                    body: ['Noto Sans SC', 'sans-serif'],
                },
                colors: {
                    brand: {
                        50: '#f0f4ff',
                        100: '#dbe4ff',
                        200: '#bac8ff',
                        300: '#91a7ff',
                        400: '#748ffc',
                        500: '#5c7cfa',
                        600: '#4c6ef5',
                        700: '#4263eb',
                        800: '#3b5bdb',
                        900: '#364fc7',
                    },
                    surface: {
                        0: '#0a0e1a',
                        50: '#0f1424',
                        100: '#151b30',
                        200: '#1c2440',
                        300: '#243052',
                        400: '#2e3d68',
                    },
                    mint: '#38d9a9',
                    coral: '#ff6b6b',
                    amber: '#fcc419',
                    sky: '#339af0',
                }
            }
        }
    }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0a0e1a; color: #c1c9d8; font-family: 'Noto Sans SC', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #151b30; }
        ::-webkit-scrollbar-thumb { background: #2e3d68; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4c6ef5; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 8px rgba(92,124,250,0.3); } 50% { box-shadow: 0 0 20px rgba(92,124,250,0.6); } }
        @keyframes progress-stripe { 0% { background-position: 0 0; } 100% { background-position: 40px 0; } }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        .slide-in { animation: slideIn 0.3s ease-out; }
        .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

        .progress-bar-striped {
            background-image: linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.1) 75%, transparent 75%, transparent);
            background-size: 40px 40px;
            animation: progress-stripe 1s linear infinite;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(21,27,48,0.9), rgba(28,36,64,0.7));
            border: 1px solid rgba(92,124,250,0.15);
            backdrop-filter: blur(12px);
        }

        .glass-card:hover { border-color: rgba(92,124,250,0.3); }

        .btn-primary {
            background: linear-gradient(135deg, #4c6ef5, #5c7cfa);
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #4263eb, #4c6ef5);
            box-shadow: 0 4px 16px rgba(76,110,245,0.4);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e03131, #ff6b6b);
            transition: all 0.2s;
        }
        .btn-danger:hover {
            box-shadow: 0 4px 16px rgba(224,49,49,0.4);
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(92,124,250,0.3);
            transition: all 0.2s;
        }
        .btn-ghost:hover {
            background: rgba(92,124,250,0.1);
            border-color: rgba(92,124,250,0.5);
        }

        .input-field {
            background: rgba(15,20,36,0.8);
            border: 1px solid rgba(92,124,250,0.2);
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #5c7cfa;
            box-shadow: 0 0 0 3px rgba(92,124,250,0.15);
        }

        .sidebar-item {
            transition: all 0.2s;
            position: relative;
        }
        .sidebar-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: #5c7cfa;
            border-radius: 0 2px 2px 0;
            transition: height 0.2s;
        }
        .sidebar-item:hover::before, .sidebar-item.active::before {
            height: 60%;
        }
        .sidebar-item.active {
            background: rgba(92,124,250,0.1);
            color: #91a7ff;
        }

        .stat-card {
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(92,124,250,0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .table-row { transition: background 0.15s; }
        .table-row:hover { background: rgba(92,124,250,0.06); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #151b30;
            border: 1px solid rgba(92,124,250,0.2);
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-content.modal-wide {
            max-width: 900px;
        }

        .dimension-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dimension-tag:hover { transform: scale(1.05); }

        .score-ring {
            position: relative;
            width: 120px;
            height: 120px;
        }
        .score-ring svg { transform: rotate(-90deg); }
        .score-ring-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

const API = '';
const fetchJSON = async (url, opts = {}) => {
    const isBody = opts.body || opts.method === 'POST' || opts.method === 'PUT';
    const res = await fetch(API + url, {
        headers: isBody ? { 'Content-Type': 'application/json', ...opts.headers } : opts.headers,
        ...opts,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
};

const STATUS_MAP = {
    pending: { label: '待执行', color: 'bg-surface-300 text-gray-300' },
    running: { label: '执行中', color: 'bg-sky/20 text-sky' },
    completed: { label: '已完成', color: 'bg-mint/20 text-mint' },
    cancelled: { label: '已取消', color: 'bg-amber/20 text-amber' },
    failed: { label: '失败', color: 'bg-coral/20 text-coral' },
};

const DS_TYPE_MAP = {
    local_file: { label: '本地文件', icon: '📄' },
    mysql: { label: 'MySQL', icon: '🐬' },
    postgresql: { label: 'PostgreSQL', icon: '🐘' },
    oracle: { label: 'Oracle', icon: '🔶' },
    sqlserver: { label: 'SQL Server', icon: '🔷' },
    sqlite: { label: 'SQLite', icon: '📦' },
};

const DIMENSION_COLORS = {
    QUALITY_BAD_EFFECTIVENESS: { bg: 'rgba(252,196,25,0.12)', text: '#fcc419', border: 'rgba(252,196,25,0.3)' },
    QUALITY_BAD_FLUENCY: { bg: 'rgba(51,154,240,0.12)', text: '#339af0', border: 'rgba(51,154,240,0.3)' },
    QUALITY_BAD_UNDERSTANDABILITY: { bg: 'rgba(92,124,250,0.12)', text: '#748ffc', border: 'rgba(92,124,250,0.3)' },
    QUALITY_BAD_COMPLETENESS: { bg: 'rgba(56,217,169,0.12)', text: '#38d9a9', border: 'rgba(56,217,169,0.3)' },
    QUALITY_BAD_SIMILARITY: { bg: 'rgba(190,75,219,0.12)', text: '#be4bdb', border: 'rgba(190,75,219,0.3)' },
    QUALITY_BAD_SECURITY: { bg: 'rgba(255,107,107,0.12)', text: '#ff6b6b', border: 'rgba(255,107,107,0.3)' },
    QUALITY_BAD_RELEVANCE: { bg: 'rgba(255,146,43,0.12)', text: '#ff922b', border: 'rgba(255,146,43,0.3)' },
};

function getDimColor(dim) {
    return DIMENSION_COLORS[dim] || { bg: 'rgba(92,124,250,0.12)', text: '#748ffc', border: 'rgba(92,124,250,0.3)' };
}

function ScoreRing({ score, size = 120 }) {
    const r = (size - 12) / 2;
    const c = 2 * Math.PI * r;
    const pct = Math.min(Math.max(score || 0, 0), 100);
    const offset = c - (pct / 100) * c;
    const color = pct >= 80 ? '#38d9a9' : pct >= 60 ? '#fcc419' : '#ff6b6b';
    return (
        <div className="score-ring" style={{ width: size, height: size }}>
            <svg width={size} height={size}>
                <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(92,124,250,0.1)" strokeWidth="6" />
                <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="6"
                    strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
                    style={{ transition: 'stroke-dashoffset 1s ease' }} />
            </svg>
            <div className="score-ring-text">
                <span style={{ fontSize: size * 0.28, fontWeight: 700, color, fontFamily: 'Space Grotesk' }}>{pct.toFixed(1)}</span>
                <span style={{ fontSize: size * 0.1, color: '#6b7a99' }}>质量评分</span>
            </div>
        </div>
    );
}

function Modal({ open, onClose, title, children, wide }) {
    if (!open) return null;
    return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className={`modal-content fade-in ${wide ? 'modal-wide' : ''}`}>
                <div className="flex items-center justify-between p-5 border-b border-brand-800/30">
                    <h3 className="font-display text-lg font-semibold text-white">{title}</h3>
                    <button onClick={onClose} className="text-gray-500 hover:text-white transition-colors text-xl leading-none">&times;</button>
                </div>
                <div className="p-5">{children}</div>
            </div>
        </div>
    );
}

function DashboardPage() {
    const [data, setData] = useState(null);
    useEffect(() => {
        fetchJSON('/api/dashboard').then(setData).catch(console.error);
    }, []);

    if (!data) return <div className="flex items-center justify-center h-64"><div className="w-8 h-8 border-2 border-brand-500 border-t-transparent rounded-full animate-spin" /></div>;

    const stats = [
        { label: '数据源', value: data.datasource_count, icon: '🗄️', color: 'from-sky/20 to-sky/5' },
        { label: '检测任务', value: data.task_count, icon: '🔍', color: 'from-mint/20 to-mint/5' },
        { label: '自定义规则', value: data.custom_rule_count, icon: '⚙️', color: 'from-amber/20 to-amber/5' },
        { label: '内置规则', value: data.builtin_rule_count, icon: '📋', color: 'from-brand-500/20 to-brand-500/5' },
    ];

    return (
        <div className="fade-in">
            <h1 className="font-display text-2xl font-bold text-white mb-6">控制台</h1>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                {stats.map((s, i) => (
                    <div key={i} className="stat-card glass-card rounded-xl p-5" style={{ animationDelay: `${i * 80}ms` }}>
                        <div className="flex items-center gap-3 mb-3">
                            <div className={`w-10 h-10 rounded-lg bg-gradient-to-br ${s.color} flex items-center justify-center text-lg`}>{s.icon}</div>
                            <span className="text-sm text-gray-400">{s.label}</span>
                        </div>
                        <div className="font-display text-3xl font-bold text-white">{s.value}</div>
                    </div>
                ))}
            </div>

            <h2 className="font-display text-lg font-semibold text-white mb-4">质量维度分布</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {data.dimensions.map((d, i) => {
                    const c = getDimColor(d.name);
                    return (
                        <div key={i} className="glass-card rounded-xl p-4 slide-in" style={{ animationDelay: `${i * 60}ms` }}>
                            <div className="flex items-center gap-2 mb-2">
                                <div className="w-2 h-2 rounded-full" style={{ background: c.text }} />
                                <span className="text-sm font-medium" style={{ color: c.text }}>
                                    {d.name.replace('QUALITY_BAD_', '').replace(/_/g, ' ')}
                                </span>
                            </div>
                            <div className="font-display text-2xl font-bold text-white">{d.count}</div>
                            <div className="text-xs text-gray-500 mt-1">条规则</div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

function DatasourcesPage() {
    const [sources, setSources] = useState([]);
    const [modal, setModal] = useState(null);
    const [browseData, setBrowseData] = useState(null);
    const [browseDsId, setBrowseDsId] = useState(null);
    const [browsePage, setBrowsePage] = useState(1);
    const [browseTable, setBrowseTable] = useState('');
    const [testResult, setTestResult] = useState(null);
    const [form, setForm] = useState({ name: '', type: 'local_file', config: {} });
    const [uploadResult, setUploadResult] = useState(null);
    const [tablesModal, setTablesModal] = useState(null);
    const [tablesList, setTablesList] = useState([]);
    const [tablesLoading, setTablesLoading] = useState(false);

    const load = () => fetchJSON('/api/datasources').then(setSources).catch(console.error);
    useEffect(() => { load(); }, []);

    const handleUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fd = new FormData();
        fd.append('file', file);
        const res = await fetch(API + '/api/datasources/upload', { method: 'POST', body: fd });
        const data = await res.json();
        setUploadResult(data);
        setForm(f => ({ ...f, type: 'local_file', config: { ...f.config, file_path: data.file_path, format: data.format } }));
    };

    const handleSave = async () => {
        if (modal === 'add') {
            await fetchJSON('/api/datasources', { method: 'POST', body: JSON.stringify(form) });
        } else if (modal === 'edit') {
            await fetchJSON(`/api/datasources/${form.id}`, { method: 'PUT', body: JSON.stringify({ name: form.name, config: form.config }) });
        }
        setModal(null);
        setForm({ name: '', type: 'local_file', config: {} });
        setUploadResult(null);
        load();
    };

    const handleTest = async (id) => {
        setTestResult(null);
        const res = await fetchJSON(`/api/datasources/${id}/test`, { method: 'POST' });
        setTestResult(res);
    };

    const handleBrowseClick = async (id) => {
        const ds = sources.find(s => s.id === id);
        const dsType = ds?.type;
        if (dsType === 'local_file') {
            setBrowseDsId(id);
            setBrowsePage(1);
            setBrowseTable('');
            const res = await fetchJSON(`/api/datasources/${id}/browse?page=1&page_size=20`);
            setBrowseData(res);
        } else {
            setTablesLoading(true);
            setTablesModal(id);
            try {
                const res = await fetchJSON(`/api/datasources/${id}/tables`);
                setTablesList(res.tables || []);
            } catch (e) {
                console.error(e);
                setTablesList([]);
            }
            setTablesLoading(false);
        }
    };

    const handleSelectTable = async (tableName) => {
        setBrowseDsId(tablesModal);
        setBrowseTable(tableName);
        setBrowsePage(1);
        setTablesModal(null);
        const res = await fetchJSON(`/api/datasources/${tablesModal}/browse?page=1&page_size=20&table=${encodeURIComponent(tableName)}`);
        setBrowseData(res);
    };

    const handleBrowsePage = async (page) => {
        setBrowsePage(page);
        const res = await fetchJSON(`/api/datasources/${browseDsId}/browse?page=${page}&page_size=20${browseTable ? '&table=' + encodeURIComponent(browseTable) : ''}`);
        setBrowseData(res);
    };

    const handleDelete = async (id) => {
        if (!confirm('确定删除此数据源？')) return;
        await fetchJSON(`/api/datasources/${id}`, { method: 'DELETE' });
        load();
    };

    const dbFields = (type) => type !== 'local_file';

    return (
        <div className="fade-in">
            <div className="flex items-center justify-between mb-6">
                <h1 className="font-display text-2xl font-bold text-white">数据源管理</h1>
                <button onClick={() => { setModal('add'); setForm({ name: '', type: 'local_file', config: {} }); setUploadResult(null); }}
                    className="btn-primary text-white px-4 py-2 rounded-lg text-sm font-medium">+ 新增数据源</button>
            </div>

            {testResult && (
                <div className={`glass-card rounded-xl p-4 mb-4 ${testResult.success ? 'border-mint/30' : 'border-coral/30'}`}>
                    <div className="flex items-center gap-2 mb-2">
                        <span className={testResult.success ? 'text-mint' : 'text-coral'}>{testResult.success ? '✓' : '✗'}</span>
                        <span className="text-white font-medium">{testResult.message}</span>
                    </div>
                    {testResult.tables && testResult.tables.length > 0 && (
                                <div className="text-sm text-gray-400">
                                    <span className="text-gray-300">数据表：</span>
                                    {testResult.tables.map((t, i) => (
                                        <span key={i} className="badge bg-brand-800/50 text-brand-300 ml-1 cursor-pointer" onClick={() => { if (browseDsId !== null) { setBrowseTable(t); handleBrowsePage(1); } }}>{t}</span>
                                    ))}
                                </div>
                            )}
                    <button onClick={() => setTestResult(null)} className="text-xs text-gray-500 mt-2 hover:text-gray-300">关闭</button>
                </div>
            )}

            <div className="grid gap-3">
                {sources.map(ds => {
                    const dt = DS_TYPE_MAP[ds.type] || { label: ds.type, icon: '📁' };
                    return (
                        <div key={ds.id} className="glass-card rounded-xl p-4 slide-in">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <span className="text-2xl">{dt.icon}</span>
                                    <div>
                                        <div className="text-white font-medium">{ds.name}</div>
                                        <div className="text-xs text-gray-500">{dt.label}{ds.config?.database ? ` · ${ds.config.database}` : ''} · 创建于 {new Date(ds.created_at).toLocaleDateString()}</div>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => handleTest(ds.id)} className="btn-ghost text-brand-300 px-3 py-1.5 rounded-lg text-xs">测试连接</button>
                                    <button onClick={() => handleBrowseClick(ds.id)} className="btn-ghost text-mint px-3 py-1.5 rounded-lg text-xs">浏览数据</button>
                                    <button onClick={() => { setModal('edit'); setForm({ id: ds.id, name: ds.name, type: ds.type, config: ds.config }); }} className="btn-ghost text-amber px-3 py-1.5 rounded-lg text-xs">编辑</button>
                                    <button onClick={() => handleDelete(ds.id)} className="btn-ghost text-coral px-3 py-1.5 rounded-lg text-xs">删除</button>
                                </div>
                            </div>
                        </div>
                    );
                })}
                {sources.length === 0 && <div className="text-center text-gray-500 py-12">暂无数据源，点击右上角新增</div>}
            </div>

            {tablesModal !== null && (
                <Modal open={true} onClose={() => { setTablesModal(null); setTablesList([]); }} title="选择数据表">
                    {tablesLoading ? (
                        <div className="text-center text-gray-400 py-8">加载中...</div>
                    ) : tablesList.length === 0 ? (
                        <div className="text-center text-gray-500 py-8">未发现数据表</div>
                    ) : (
                        <div>
                            <div className="text-sm text-gray-400 mb-3">共 {tablesList.length} 张表</div>
                            <div className="max-h-96 overflow-y-auto space-y-1">
                                {tablesList.map((t, i) => (
                                    <div key={i} className="flex items-center justify-between p-3 bg-surface-0 rounded-lg hover:bg-surface-200 transition-colors">
                                        <div className="flex-1 min-w-0">
                                            <div className="text-white text-sm font-medium truncate">{t.name}</div>
                                            <div className="text-xs text-gray-500 mt-0.5">
                                                {t.row_count >= 0 ? `${t.row_count.toLocaleString()} 行` : '行数未知'}
                                                {t.column_count ? ` · ${t.column_count} 列` : ''}
                                            </div>
                                        </div>
                                        <button onClick={() => handleSelectTable(t.name)}
                                            className="btn-primary text-white px-3 py-1.5 rounded-lg text-xs ml-3 flex-shrink-0">查看</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </Modal>
            )}

            {browseData && (
                <Modal open={!!browseData} onClose={() => { setBrowseData(null); setBrowseDsId(null); setBrowseTable(''); }} title={browseTable ? `数据浏览 - ${browseTable}` : '数据浏览'}>
                    <div className="overflow-x-auto">
                        <div className="flex items-center justify-between mb-3">
                            <div className="text-sm text-gray-400">共 {browseData.total.toLocaleString()} 条 · 第 {browsePage} 页</div>
                            {browseTable && (
                                <button onClick={() => { setBrowseData(null); handleBrowseClick(browseDsId); }}
                                    className="btn-ghost text-brand-300 px-2 py-1 rounded text-xs">切换表</button>
                            )}
                        </div>
                        {browseData.columns.length > 0 ? (
                            <table className="w-full text-sm">
                                <thead>
                                    <tr className="border-b border-brand-800/30">
                                        {browseData.columns.map(c => <th key={c} className="text-left py-2 px-3 text-gray-400 font-medium whitespace-nowrap">{c}</th>)}
                                    </tr>
                                </thead>
                                <tbody>
                                    {browseData.rows.map((row, i) => (
                                        <tr key={i} className="table-row border-b border-brand-800/10">
                                            {browseData.columns.map(c => <td key={c} className="py-2 px-3 text-gray-300 max-w-xs truncate">{String(row[c] ?? '')}</td>)}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : <div className="text-gray-500 text-center py-8">无数据</div>}
                        <div className="flex items-center justify-center gap-2 mt-4">
                            <button disabled={browsePage <= 1} onClick={() => handleBrowsePage(1)}
                                className="btn-ghost text-brand-300 px-2 py-1 rounded text-xs disabled:opacity-30">首页</button>
                            <button disabled={browsePage <= 1} onClick={() => handleBrowsePage(browsePage - 1)}
                                className="btn-ghost text-brand-300 px-3 py-1 rounded text-xs disabled:opacity-30">上一页</button>
                            <span className="text-xs text-gray-400 px-2">{browsePage} / {Math.max(1, Math.ceil(browseData.total / 20))}</span>
                            <button disabled={browsePage * 20 >= browseData.total} onClick={() => handleBrowsePage(browsePage + 1)}
                                className="btn-ghost text-brand-300 px-3 py-1 rounded text-xs disabled:opacity-30">下一页</button>
                            <button disabled={browsePage * 20 >= browseData.total} onClick={() => handleBrowsePage(Math.ceil(browseData.total / 20))}

                </Modal>
            )}

            <Modal open={!!modal} onClose={() => { setModal(null); setUploadResult(null); }} title={modal === 'add' ? '新增数据源' : '编辑数据源'}>
                <div className="space-y-4">
                    <div>
                        <label className="block text-sm text-gray-400 mb-1">名称</label>
                        <input className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.name}
                            onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="输入数据源名称" />
                    </div>
                    <div>
                        <label className="block text-sm text-gray-400 mb-1">类型</label>
                        <select className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.type}
                            onChange={e => setForm(f => ({ ...f, type: e.target.value, config: {} }))} disabled={modal === 'edit'}>
                            {Object.entries(DS_TYPE_MAP).map(([k, v]) => <option key={k} value={k}>{v.icon} {v.label}</option>)}
                        </select>
                    </div>

                    {form.type === 'local_file' ? (
                        <div>
                            <label className="block text-sm text-gray-400 mb-1">上传文件</label>
                            <input type="file" accept=".json,.jsonl,.csv,.xlsx,.xls,.parquet,.txt" onChange={handleUpload}
                                className="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-brand-800/50 file:text-brand-300 hover:file:bg-brand-700/50" />
                            {uploadResult && <div className="text-xs text-mint mt-2">✓ 已上传: {uploadResult.filename} ({(uploadResult.size / 1024).toFixed(1)} KB)</div>}
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {form.type !== 'sqlite' && (
                                <>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs text-gray-400 mb-1">主机</label>
                                            <input className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.config.host || ''}
                                                onChange={e => setForm(f => ({ ...f, config: { ...f.config, host: e.target.value } }))} placeholder="localhost" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-400 mb-1">端口</label>
                                            <input className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.config.port || ''}
                                                onChange={e => setForm(f => ({ ...f, config: { ...f.config, port: e.target.value } }))} placeholder="3306" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs text-gray-400 mb-1">用户名</label>
                                            <input className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.config.username || ''}
                                                onChange={e => setForm(f => ({ ...f, config: { ...f.config, username: e.target.value } }))} />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-400 mb-1">密码</label>
                                            <input type="password" className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.config.password || ''}
                                                onChange={e => setForm(f => ({ ...f, config: { ...f.config, password: e.target.value } }))} />
                                        </div>
                                    </div>
                                </>
                            )}
                            <div>
                                <label className="block text-xs text-gray-400 mb-1">数据库</label>
                                <input className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.config.database || ''}
                                    onChange={e => setForm(f => ({ ...f, config: { ...f.config, database: e.target.value } }))} />
                            </div>
                            <div>
                                <label className="block text-xs text-gray-400 mb-1">SQL 查询</label>
                                <textarea className="input-field w-full rounded-lg px-3 py-2 text-white text-sm font-mono" rows={3}
                                    value={form.config.query || ''} onChange={e => setForm(f => ({ ...f, config: { ...f.config, query: e.target.value } }))}
                                    placeholder="SELECT * FROM table_name" />

                        </div>
                    )}

                    <div className="flex justify-end gap-3 pt-2">
                        <button onClick={() => setModal(null)} className="btn-ghost text-gray-400 px-4 py-2 rounded-lg text-sm">取消</button>

}

function RulesPage() {
    const [dimensions, setDimensions] = useState([]);
    const [ruleTypes, setRuleTypes] = useState([]);
    const [activeDim, setActiveDim] = useState(null);
    const [rules, setRules] = useState([]);
    const [search, setSearch] = useState('');
    const [modal, setModal] = useState(null);
    const [form, setForm] = useState({ name: '', metric_type: '', group: 'custom', rule_type: 'pattern', description: '', config: {} });
    const [error, setError] = useState('');
    const [deleteConfirm, setDeleteConfirm] = useState(null);

    const RULE_TYPE_LABELS = { pattern: '正则模式匹配', keyword: '关键词检测', length: '长度校验', regex: '单正则匹配', builtin: '内置规则' };

    useEffect(() => {
        fetchJSON('/api/rules/dimensions').then(setDimensions).catch(console.error);
        fetchJSON('/api/rules/rule-types').then(setRuleTypes).catch(console.error);
    }, []);

    const loadRules = useCallback(() => {
        const params = new URLSearchParams();
        if (activeDim) params.set('dimension', activeDim);
        if (search) params.set('search', search);
        fetchJSON(`/api/rules?${params}`).then(setRules).catch(console.error);
    }, [activeDim, search]);

    useEffect(() => { loadRules(); }, [loadRules]);

    const buildConfig = () => {
        const rt = form.rule_type;
        if (rt === 'pattern') return { patterns: form.config.patterns || [] };
        if (rt === 'keyword') return { keywords: form.config.keywords || [] };
        if (rt === 'length') return { min_length: form.config.min_length ?? 0, max_length: form.config.max_length ?? 999999 };
        if (rt === 'regex') return { pattern: form.config.pattern || '' };
        return form.config;
    };

    const handleSave = async () => {
        setError('');
        try {
            const config = buildConfig();
            const payload = { ...form, config };
            if (modal === 'add') {
                await fetchJSON('/api/rules', { method: 'POST', body: JSON.stringify(payload) });
            } else if (modal === 'edit') {
                const { id, created_at, updated_at, is_builtin, ...updateData } = payload;
                await fetchJSON(`/api/rules/${form.id}`, { method: 'PUT', body: JSON.stringify(updateData) });
            }
            setModal(null);
            setForm({ name: '', metric_type: '', group: 'custom', rule_type: 'pattern', description: '', config: {} });
            loadRules();
        } catch (e) {
            try {
                const err = JSON.parse(e.message.replace('HTTP 422: ', '').replace('HTTP 409: ', '').replace('HTTP 400: ', ''));
                setError(err.detail || e.message);
            } catch {
                setError(e.message);
            }
        }
    };

    const handleEdit = (r) => {
        setForm({
            id: r.id, name: r.name, metric_type: r.metric_type,
            group: r.group, rule_type: r.rule_type || 'pattern',
            description: r.description || '', config: r.config || {},
        });
        setModal('edit');
    };

    const handleDelete = async (id) => {
        try {
            await fetchJSON(`/api/rules/${id}`, { method: 'DELETE' });
            setDeleteConfirm(null);
            loadRules();
        } catch (e) {
            try {
                const err = JSON.parse(e.message.replace('HTTP 409: ', '').replace('HTTP 400: ', ''));
                alert(err.detail || '删除失败');
            } catch { alert('删除失败: ' + e.message); }
            setDeleteConfirm(null);
        }
    };

    const addPatternItem = () => setForm(f => ({ ...f, config: { ...f.config, patterns: [...(f.config.patterns || []), ''] } }));
    const removePatternItem = (i) => setForm(f => ({ ...f, config: { ...f.config, patterns: f.config.patterns.filter((_, idx) => idx !== i) } }));
    const updatePatternItem = (i, v) => setForm(f => ({ ...f, config: { ...f.config, patterns: f.config.patterns.map((p, idx) => idx === i ? v : p) } }));

    const addKeywordItem = () => setForm(f => ({ ...f, config: { ...f.config, keywords: [...(f.config.keywords || []), ''] } }));
    const removeKeywordItem = (i) => setForm(f => ({ ...f, config: { ...f.config, keywords: f.config.keywords.filter((_, idx) => idx !== i) } }));
    const updateKeywordItem = (i, v) => setForm(f => ({ ...f, config: { ...f.config, keywords: f.config.keywords.map((k, idx) => idx === i ? v : k) } }));

    return (
        <div className="fade-in">
            <div className="flex items-center justify-between mb-6">
                <h1 className="font-display text-2xl font-bold text-white">规则管理</h1>
                <button onClick={() => { setModal('add'); setForm({ name: '', metric_type: '', group: 'custom', rule_type: 'pattern', description: '', config: {} }); setError(''); }}
                    className="btn-primary text-white px-4 py-2 rounded-lg text-sm font-medium">+ 自定义规则</button>
            </div>

            <div className="flex items-center gap-3 mb-4 flex-wrap">
                <input className="input-field rounded-lg px-3 py-2 text-white text-sm flex-1 min-w-[200px]" placeholder="搜索规则..."
                    value={search} onChange={e => setSearch(e.target.value)} />
                <button onClick={() => setActiveDim(null)} className={`dimension-tag ${!activeDim ? 'bg-brand-600/30 text-brand-200 border border-brand-500/40' : 'bg-surface-200 text-gray-400 border border-transparent'}`}
                    >全部</button>
                {dimensions.map(d => {
                    const c = getDimColor(d.name);
                    const isActive = activeDim === d.name;
                    return (
                        <button key={d.name} onClick={() => setActiveDim(isActive ? null : d.name)}
                            className="dimension-tag" style={{
                                background: isActive ? c.bg : 'rgba(28,36,64,0.5)',
                                color: isActive ? c.text : '#6b7a99',
                                border: `1px solid ${isActive ? c.border : 'transparent'}`,
                            }}>
                            {d.name.replace('QUALITY_BAD_', '').replace(/_/g, ' ')}
                            <span className="opacity-60">({d.count})</span>
                        </button>
                    );
                })}
            </div>

            <div className="grid gap-2">
                {rules.map((r, i) => {
                    const c = getDimColor(r.metric_type);
                    return (
                        <div key={`${r.id}-${i}`} className="glass-card rounded-xl p-4 slide-in" style={{ animationDelay: `${i * 30}ms` }}>
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-2 h-8 rounded-full" style={{ background: c.text }} />
                                    <div>
                                        <div className="flex items-center gap-2 flex-wrap">
                                            <span className="text-white font-medium font-display">{r.name}</span>
                                            {r.is_builtin ? (
                                                <span className="badge bg-brand-800/40 text-brand-300">内置</span>
                                            ) : (
                                                <span className="badge bg-amber/15 text-amber">自定义</span>
                                            )}
                                            <span className="badge" style={{ background: c.bg, color: c.text }}>
                                                {r.metric_type.replace('QUALITY_BAD_', '').replace(/_/g, ' ')}
                                            </span>
                                            {!r.is_builtin && r.rule_type && (
                                                <span className="badge bg-surface-300 text-gray-400">
                                                    {RULE_TYPE_LABELS[r.rule_type] || r.rule_type}
                                                </span>
                                            )}
                                        </div>
                                        {r.description && <div className="text-xs text-gray-500 mt-1 max-w-lg truncate">{r.description}</div>}
                                        {!r.is_builtin && r.rule_type === 'pattern' && r.config?.patterns && (
                                            <div className="text-xs text-gray-600 mt-1 truncate">模式: {r.config.patterns.join(' | ')}</div>
                                        )}
                                        {!r.is_builtin && r.rule_type === 'keyword' && r.config?.keywords && (
                                            <div className="text-xs text-gray-600 mt-1 truncate">关键词: {r.config.keywords.join(', ')}</div>
                                        )}
                                        {!r.is_builtin && r.rule_type === 'length' && r.config && (
                                            <div className="text-xs text-gray-600 mt-1">长度范围: {r.config.min_length ?? 0} ~ {r.config.max_length ?? '∞'}</div>
                                        )}
                                        {!r.is_builtin && r.rule_type === 'regex' && r.config?.pattern && (
                                            <div className="text-xs text-gray-600 mt-1 truncate font-mono">正则: {r.config.pattern}</div>
                                        )}
                                    </div>
                                </div>
                                {!r.is_builtin && (
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => handleEdit(r)} className="btn-ghost text-amber px-3 py-1 rounded text-xs">编辑</button>
                                        <button onClick={() => setDeleteConfirm(r)} className="btn-ghost text-coral px-3 py-1 rounded text-xs">删除</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                })}
                {rules.length === 0 && <div className="text-center text-gray-500 py-12">无匹配规则</div>}
            </div>

            {deleteConfirm && (
                <Modal open={!!deleteConfirm} onClose={() => setDeleteConfirm(null)} title="确认删除">
                    <div className="space-y-4">
                        <p className="text-gray-300">确定要删除自定义规则 <span className="text-white font-medium">{deleteConfirm.name}</span> 吗？此操作不可撤销。</p>
                        {deleteConfirm.description && <p className="text-sm text-gray-500">{deleteConfirm.description}</p>}
                        <div className="flex justify-end gap-3">
                            <button onClick={() => setDeleteConfirm(null)} className="btn-ghost text-gray-400 px-4 py-2 rounded-lg text-sm">取消</button>
                            <button onClick={() => handleDelete(deleteConfirm.id)} className="btn-danger text-white px-4 py-2 rounded-lg text-sm">确认删除</button>
                        </div>
                    </div>
                </Modal>
            )}

            <Modal open={!!modal} onClose={() => { setModal(null); setError(''); }} title={modal === 'add' ? '创建自定义规则' : '编辑自定义规则'}>
                <div className="space-y-4">
                    {error && (
                        <div className="bg-coral/10 border border-coral/30 rounded-lg px-3 py-2 text-sm text-coral">{error}</div>
                    )}
                    <div>
                        <label className="block text-sm text-gray-400 mb-1">规则名称 <span className="text-coral">*</span></label>
                        <input className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.name}
                            onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="如: MyCustomPatternCheck" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                        <div>
                            <label className="block text-sm text-gray-400 mb-1">质量维度 <span className="text-coral">*</span></label>
                            <select className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.metric_type}
                                onChange={e => setForm(f => ({ ...f, metric_type: e.target.value }))}>
                                <option value="">选择维度</option>
                                {dimensions.map(d => <option key={d.name} value={d.name}>{d.name.replace('QUALITY_BAD_', '').replace(/_/g, ' ')}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm text-gray-400 mb-1">规则类型 <span className="text-coral">*</span></label>
                            <select className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" value={form.rule_type}
                                onChange={e => setForm(f => ({ ...f, rule_type: e.target.value, config: {} }))}>
                                {ruleTypes.map(rt => <option key={rt.value} value={rt.value}>{rt.label}</option>)}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label className="block text-sm text-gray-400 mb-1">描述</label>
                        <textarea className="input-field w-full rounded-lg px-3 py-2 text-white text-sm" rows={2}
                            value={form.description} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} placeholder="描述此规则的检测目的..." />
                    </div>

                    {form.rule_type === 'pattern' && (
                        <div>
                            <label className="block text-sm text-gray-400 mb-2">正则模式列表 <span className="text-coral">*</span></label>
                            <div className="space-y-2">
                                {(form.config.patterns || []).map((p, i) => (
                                    <div key={i} className="flex items-center gap-2">
                                        <input className="input-field flex-1 rounded-lg px-3 py-2 text-white text-sm font-mono"
                                            value={p} onChange={e => updatePatternItem(i, e.target.value)} placeholder="输入正则表达式，如: \\d{4}-\\d{2}-\\d{2}" />
                                        <button onClick={() => removePatternItem(i)} className="text-coral hover:text-red-400 text-lg leading-none">&times;</button>
                                    </div>
                                ))}
                                <button onClick={addPatternItem} className="btn-ghost text-brand-300 px-3 py-1.5 rounded-lg text-xs w-full">+ 添加模式</button>
                            </div>
                        </div>
                    )}

                    {form.rule_type === 'keyword' && (
                        <div>
                            <label className="block text-sm text-gray-400 mb-2">关键词列表 <span className="text-coral">*</span></label>
                            <div className="space-y-2">
                                {(form.config.keywords || []).map((kw, i) => (
                                    <div key={i} className="flex items-center gap-2">
                                        <input className="input-field flex-1 rounded-lg px-3 py-2 text-white text-sm"
                                            value={kw} onChange={e => updateKeywordItem(i, e.target.value)} placeholder="输入关键词" />
                                        <button onClick={() => removeKeywordItem(i)} className="text-coral hover:text-red-400 text-lg leading-none">&times;</button>
                                    </div>
                                ))}
                                <button onClick={addKeywordItem} className="btn-ghost text-brand-300 px-3 py-1.5 rounded-lg text-xs w-full">+ 添加关键词</button>
                            </div>
                        </div>
                    )}

                    {form.rule_type === 'length' && (
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="block text-sm text-gray-400 mb-1">最小长度</label>
                                <input type="number" className="input-field w-full rounded-lg px-3 py-2 text-white text-sm"
                                    value={form.config.min_length ?? 0} onChange={e => setForm(f => ({ ...f, config: { ...f.config, min_length: parseInt(e.target.value) || 0 } }))}
                                    min={0} />
                            </div>
                            <div>
                                <label className="block text-sm text-gray-400 mb-1">最大长度</label>
                                <input type="number" className="input-field w-full rounded-lg px-3 py-2 text-white text-sm"
                                    value={form.config.max_length ?? 999999} onChange={e => setForm(f => ({ ...f, config: { ...f.config, max_length: parseInt(e.target.value) || 999999 } }))}
                                    min={0} />
                            </div>
                        </div>
                    )}

                    {form.rule_type === 'regex' && (
                        <div>
                            <label className="block text-sm text-gray-400 mb-1">正则表达式 <span className="text-coral">*</span></label>
                            <input className="input-field w-full rounded-lg px-3 py-2 text-white text-sm font-mono"
                                value={form.config.pattern || ''} onChange={e => setForm(f => ({ ...f, config: { ...f.config, pattern: e.target.value } }))}
                                placeholder="输入正则表达式，如: \\d{4}-\\d{2}-\\d{2}" />
                        </div>
                    )}

                    {form.rule_type && ruleTypes.find(rt => rt.value === form.rule_type) && (
                        <div className="text-xs text-gray-600 bg-surface-0 rounded-lg px-3 py-2">
                            💡 {ruleTypes.find(rt => rt.value === form.rule_type).description}
                        </div>
                    )}

                    <div className="flex justify-end gap-3 pt-2">
                        <button onClick={() => { setModal(null); setError(''); }} className="btn-ghost text-gray-400 px-4 py-2 rounded-lg text-sm">取消</button>
                        <button onClick={handleSave} className="btn-primary text-white px-4 py-2 rounded-lg text-sm"
                            disabled={!form.name || !form.metric_type}>{modal === 'add' ? '创建' : '保存'}</button>
                    </div>
                </div>
            </Modal>
        </div>
    );
}
